# =========================================================
# Forensic License Plate Enhancement & Recovery - Config
# =========================================================

detection:
  # Path to fine-tuned YOLOv8 weights (see notebooks/01_finetune_plate_detector.ipynb)
  weights: "models/plate_detector/best.pt"
  # Fallback pretrained COCO/general detector if fine-tuned weights are absent
  fallback_weights: "yolov8n.pt"
  conf_threshold: 0.25
  iou_threshold: 0.45
  # Minimum crop size (px) below which we upsample before enhancement
  min_crop_height: 32


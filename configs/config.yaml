enhancement:
  quality_guidance:
    enabled: true
    margin: 0.05
    weights:
      sharpness: 1.0
      contrast: 1.0

  perspective:
    enabled: true
    target_width: 200
    target_height: 60

  denoise:
    enabled: true
    method: "fastNlMeans"
    h: 8
    template_window_size: 3
    search_window_size: 7

  deblur:
    enabled: true
    method: "wiener"
    # other deblur-specific params here

  super_resolution:
    enabled: false
    method: "espcn"
    scale: 2
    model_name: null
    tile: 0

  contrast:
    enabled: true
    method: "clahe"
    clip_limit: 2.0
    tile_grid_size: [4, 4]

  multi_frame:
    enabled: true
    max_frames: 5
    sharpness_percentile: 80
    alignment: "ecc"
    fusion: "median"

ocr:
  engine: "easyocr"
  languages: ["en"]
  allowlist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  min_confidence: 0.30
  target_char_height: 64.0
  format_patterns:
    # ---------- India ----------
    # Standard: MH12AB1234 (state code, RTO code, series letters, 4-digit number)
    - "^[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}$"
    # # Standard, no series letters: MH121234 (older/some commercial plates)
    # - "^[A-Z]{2}[0-9]{2}[0-9]{4}$"
    # New BH-series (portable, state-neutral): 22BH1234AB
    - "^[0-9]{2}BH[0-9]{4}[A-Z]{2}$"

    # ---------- Australia ----------
    # Most common current format (most states): 3 digits + 3 letters, e.g. 889VSM
    - "^[0-9]{3}[A-Z]{3}$"
    # Reverse order, also common: 3 letters + 3 digits, e.g. ABC123
    - "^[A-Z]{3}[0-9]{3}$"
    # Older NSW/VIC 2+2+2 style: AB12CD
    - "^[A-Z]{2}[0-9]{2}[A-Z]{2}$"
    # WA/SA style: 1 letter + 3 digits + 1 letter, e.g. A123B
    - "^[A-Z][0-9]{3}[A-Z]$"

evaluation:
  quality_metrics: ["psnr", "ssim"]
  ocr_metrics: ["cer", "exact_match"]
  save_visual_grids: true

paths:
  raw_dir: "data/raw"
  processed_dir: "data/sample_outputs"
  output_dir: "outputs"
  log_dir: "outputs/logs"
